name: Build Android APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Static analysis
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Validate signing secrets
        run: |
          [ -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ] || (echo "Missing secret: ANDROID_KEYSTORE_BASE64" && exit 1)
          [ -n "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" ] || (echo "Missing secret: ANDROID_KEYSTORE_PASSWORD" && exit 1)
          [ -n "${{ secrets.ANDROID_KEY_ALIAS }}" ] || (echo "Missing secret: ANDROID_KEY_ALIAS" && exit 1)
          [ -n "${{ secrets.ANDROID_KEY_PASSWORD }}" ] || (echo "Missing secret: ANDROID_KEY_PASSWORD" && exit 1)

      - name: Prepare release keystore
        run: |
          mkdir -p android/app
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > android/app/upload-keystore.jks
          cat > android/key.properties <<KEYS
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          storeFile=upload-keystore.jks
          KEYS

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Cleanup signing files
        if: always()
        run: |
          rm -f android/key.properties
          rm -f android/app/upload-keystore.jks
